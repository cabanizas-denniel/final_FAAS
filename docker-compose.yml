services:
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-transcription-faas:latest
    container_name: audio-transcription-faas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Allow overriding host/port without editing .env
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Persist uploads across restarts
      - ./uploads:/app/uploads
      # Cache the downloaded Whisper model between runs
      - whisper-cache:/home/appuser/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  whisper-cache:
