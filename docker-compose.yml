services:
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-transcription-faas:latest
    container_name: audio-transcription-faas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      # Image name the orchestrator will use when spawning worker containers
      WORKER_IMAGE: audio-transcription-faas:latest
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Shared between orchestrator and every worker container (via volumes_from)
      - ./uploads:/app/uploads
      # Whisper model cache — workers reuse the downloaded model
      - whisper-cache:/root/.cache
      # Docker socket — lets the orchestrator provision worker containers
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  whisper-cache:
